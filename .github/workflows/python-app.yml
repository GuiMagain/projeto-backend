name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: fastapi-app:latest

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15 

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Poetry
        run: pip install poetry

      - name: Instalar Python e configurar cache do Poetry
        uses: actions/setup-python@v5
        with:
          python-version: '3.14' 
          cache: 'poetry'

      

      - name: Executar os testes
        run: poetry run pytest

      - name: Construir a imagem Docker
        run: docker build -t ${{ env.IMAGE_NAME }} .

      - name: Validar o container
        run: docker run -d ${{ env.IMAGE_NAME }}

      - name: Iniciar o container
        run: docker run -d --name fastapi-app -p 8000:8000 ${{ env.IMAGE_NAME }}
      
      - name: Validar a aplicação
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8000/; then
              echo "API iniciada e respondendo corretamente!"
              exit 0
            fi
            echo "Aguardando a API iniciar..."
            sleep 3
          done
      
          echo "A API não respondeu dentro do tempo esperado."
          docker logs fastapi-app
          exit 1
      
      - name: Encerrar o container
        if: always()
        run: docker stop fastapi-app || true
