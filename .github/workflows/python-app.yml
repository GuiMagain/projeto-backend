name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: fastapi-app
  IMAGE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Poetry
      run: pip install poetry

    - name: Install dependencies
      run: poetry install --no-root --no-interaction

    - name: Run tests
      run: poetry run pytest

    - name: Build Docker image
      run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" .

    - name: Run container and validate API
      run: |
        docker run -d --name api-test -p 8000:8000 "$IMAGE_NAME:$IMAGE_TAG"
        for i in $(seq 1 15); do
          if curl -fsS http://localhost:8000/docs > /dev/null; then
            break
          fi
          sleep 2
        done
        curl -fsS http://localhost:8000/docs > /dev/null

    - name: Clean up container
      if: always()
      run: |
        docker stop api-test || true
        docker rm api-test || true
