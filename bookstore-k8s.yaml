apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  ports:
  - port: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: api-livros
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000
  selector:
    app: api-livros
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-livros
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-livros
  template:
    metadata:
      labels:
        app: api-livros
    spec:
      containers:
      - name: api-livros
        image: localhost/projeto_back_app:latest
        imagePullPolicy: Never # Usa a imagem local do Podman
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://redis:6379/0"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
      - name: celery-worker
        image: localhost/projeto_back_celery:latest
        imagePullPolicy: Never
        command: ["celery", "-A", "seu_modulo", "worker", "--loglevel=info"]
        env:
        - name: REDIS_URL
          value: "redis://redis:6379/0"