version: "3.8"

services:
  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:7.6.0
    container_name: livros-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: docker.io/confluentinc/cp-kafka:7.6.0
    container_name: livros-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: livros-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://livros-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPICS_REPLICATION_FACTOR: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
  kafka-ui:
    image: docker.io/provectuslabs/kafka-ui:v0.7.2
    container_name: livros-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=livros-kafka
      - KAFKA_CLUSTERS_0_ZOOKEEPER=livros-zookeeper:2181
      - KAFKA_CLUSTERS_0_NAME=livros-kafka
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=livros-kafka:9092
      - LOGGING_LEVEL_ROOT=WARN
      - LOGGING_LEVEL_COM_PROVECTUS=INFO
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: livros-redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: livraria-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app:z
    env_file:
      - .env
    environment:
      - KAFKA_SERVER=livros-kafka:9092
      - REDIS_HOST=livros-redis
      - REDIS_PORT=6379
    command: poetry run uvicorn livraria:app --host 0.0.0.0 --port 8000 --reload

  celery:
    build: .
    container_name: livros-celery
    command: poetry run celery -A celery_app:celery_app worker --loglevel=info
    volumes:
      - .:/app:z
    env_file:
      - .env
    environment:
      - REDIS_HOST=livros-redis
      - REDIS_PORT=6379

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: logstash
    depends_on:
      - elasticsearch
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  esdata: