[project]
name = "projeto-back"
version = "0.1.0"
description = ""
authors = [
    {name = "GuiMagain", email = "guimbrum@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "python-dotenv (>=1.0.0)",
    "redis (>=5.0.0)",
    "kafka-python (>=3.0.11,<4.0.0)",
    "celery (>=5.3.0)",
    "elasticsearch (>=9.5.1,<10.0.0)",
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-mock (>=3.17.0,<4.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]